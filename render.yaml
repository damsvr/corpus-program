# Blueprint Render : service web Next.js + Postgres géré (Francfort, RGPD).
services:
  - type: web
    name: corpus-program
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm ci --include=dev && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /login
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: corpus-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 22

databases:
  - name: corpus-db
    region: frankfurt
    plan: basic-256mb
    databaseName: corpus
